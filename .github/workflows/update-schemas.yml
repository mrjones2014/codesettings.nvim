name: Update Schemas
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # every day at 1AM
jobs:
  schemas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build
        run: nix develop .#ci --command just build
      - name: Submit PR with changes
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.UPDATE_SCHEMAS_TOKEN }}
          commit-message: "chore(build): Update schemas"
          branch: update-schemas
          title: "chore(build): Update schemas"
          body: "Automated update of all supported JSON schema files."
          delete-branch: true
      - name: Enable auto-merge
        if: ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr review --approve "${{ steps.create-pr.outputs.pull-request-number }}"
          gh pr merge --squash --auto "${{ steps.create-pr.outputs.pull-request-number }}"
