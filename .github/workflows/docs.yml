on:
  push:
    branches: [master]
name: docs
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: panvimdoc
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: ${{ github.event.repository.name }}
          version: "Neovim >= 0.11.0"
          demojify: true
          treesitter: true
          # exclude the toplevel `# codesettings.nvim` heading
          # because it makes the section tags have duped project name
          shiftheadinglevelby: -1
      - name: Generate helptags
        run: nix develop .#ci --command nvim --headless -c 'helptags doc' -c 'qa'
      - name: Run benchmarks
        run: nix develop .#ci --command just bench
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        id: create-pr
        with:
          token: ${{ secrets.UPDATE_SCHEMAS_TOKEN }}
          commit-message: "chore(ci): auto-generate vimdoc"
          branch: auto-generate-vimdoc
          title: "chore(ci): auto-generate vimdoc"
          body: "Automated vimdoc and benchmark report regeneration."
          labels: documentation
          delete-branch: true
      - name: Enable auto-merge
        if: ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr review --approve "${{ steps.create-pr.outputs.pull-request-number }}"
          gh pr merge --squash --auto "${{ steps.create-pr.outputs.pull-request-number }}"
